# Surge iPhone 配置模板
# 公开脱敏模板：请替换占位符，并在 Surge UI 中配置设备证书与 Keystore。

[General]
#!include Shared-General.dconf

[Host]
dns.alidns.com = 223.5.5.5, 223.6.6.6

[Ponte]
server-proxy-name= Hysteria

[Proxy]
#!include Shared-Routing.dconf

[Proxy Group]
#!include Shared-Routing.dconf

[Rule]
#!include Shared-Routing.dconf

[MITM]
h2 = true
hostname-disabled = gateway.icloud.com, gateway.icloud.com.cn, weather-data.apple.com, buy.itunes.apple.com, ios.chat.openai.com
