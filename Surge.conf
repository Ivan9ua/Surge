# Surge Mac 配置模板
# 公开脱敏模板：请替换占位符，并在 Surge UI 中配置设备证书。

[General]
#!include Shared-General.dconf

[Ponte]
server-proxy-name= HK

[Testing]
# 测试流量限制
download-duration-limit= 5
upload-size-limit= 104857600
upload-duration-limit= 5

[Proxy]
#!include Shared-Routing.dconf

[Proxy Group]
#!include Shared-Routing.dconf

[Rule]
#!include Shared-Routing.dconf

[MITM]
h2 = true

[MTProto]
interface = 127.0.0.1
port = 5753
secret = 00000000000000000000000000000000
ipv6 = false
dc-config-url = https://ruleset.skk.moe/Internal/mtproto-dc-config.json
