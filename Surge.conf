# Surge 双端统一配置模板
# 公开脱敏模板：请替换占位符，并在 Surge UI 中配置设备证书与 Keystore。

[General]
#!include Shared-General.dconf
# macOS 专用：ICMP 转发与 /etc/hosts 读取
icmp-forwarding = true #!MACOS-ONLY
read-etc-hosts = true #!MACOS-ONLY

[Host]
#!include Shared-General.dconf

[Ponte]
#!include Shared-General.dconf

[Testing]
# 测试流量限制（macOS 专用）
download-duration-limit = 5 #!MACOS-ONLY
upload-size-limit = 104857600 #!MACOS-ONLY
upload-duration-limit = 5 #!MACOS-ONLY

[Proxy]
#!include Shared-Routing.dconf

[Proxy Group]
#!include Shared-Routing.dconf

[Rule]
#!include Shared-Routing.dconf

[MITM]
#!include Shared-General.dconf
